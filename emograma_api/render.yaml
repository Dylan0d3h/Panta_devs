# Publicação da API no Render (render.com): "New > Blueprint" apontando para este repositório.
services:
  - type: web
    name: hemograma-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
